# Headers de seguridad compartidos.
# nginx NO hereda add_header cuando un bloque hijo define los suyos,
# por eso este archivo se incluye explícitamente en cada location que
# agrega headers propios (cache-control, expires, etc.).
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'self'; base-uri 'self'" always;
