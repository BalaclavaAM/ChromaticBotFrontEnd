<div class="modal-header">
  <h5 class="modal-title">{{ 'poster.title' | translate }}</h5>
  <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
</div>
<div class="modal-body text-center">
  <img [src]="posterUrl" class="img-fluid rounded shadow-lg" alt="Póster Cromático" style="max-height: 70vh;">
</div>
<div class="modal-footer">
  <a
    [href]="posterUrl"
    [download]="'paleta-cromatica-' + userName + '.png'"
    class="btn btn-success">
    <i class="bi bi-download"></i> {{ 'poster.download' | translate }}
  </a>
  @if (canShare) {
    <button
      (click)="share()"
      class="btn btn-primary">
      <i class="bi bi-share"></i> {{ 'poster.share' | translate }}
    </button>
  }
  <button
    type="button"
    class="btn btn-secondary"
    (click)="activeModal.close()">
    {{ 'poster.close' | translate }}
  </button>
</div>
