<div class="album-card" [@cardFlip]="state" (click)="cardClicked()" (keydown.enter)="cardClicked()" role="button" tabindex="0">
  @if (state === 'default') {
    <div class="face back">
      <div class="cb-cover">
        <img class="cb-cover-img" [src]="albumData?.image" [alt]="albumData?.album" loading="lazy">
        <span class="cb-song-count mono">
          {{ albumData?.songs?.length }}<i class="bi bi-music-note-list ms-1"></i>
        </span>
      </div>
      <ul class="cb-palette" aria-hidden="true">
        @for (color of albumData?.colors; track $index) {
          <li [style.background-color]="'rgb(' + color.join(', ') + ')'"></li>
        }
      </ul>
      <div class="cb-info">
        <h3 class="cb-title" placement="bottom" [ngbTooltip]="albumData?.album">{{ smallTitle }}</h3>
      </div>
    </div>
  } @else {
    <div class="face front">
      <p class="eyebrow mb-2">{{ 'albumCard.songs' | translate }}</p>
      <ul class="cb-songs mono">
        @for (song of albumData?.songs; track $index) {
          <li>{{ song.name }} <span class="cb-song-artists">{{ song.artists }}</span></li>
        }
      </ul>
    </div>
  }
</div>
